<div class="posts-grid">
  <article class="post-card">
    <img [src]="recipeDetails.img" class="recipe-image" alt="{{recipeDetails.nom}}">
    
    <div class="post-content">
      <div class="tag">{{recipeDetails.categorie}}</div>
      
      <h2 class="post-title">{{recipeDetails.nom}}</h2>
      
      <div class="post-meta">
        <span class="ingredients-label">Ingrédients :</span>
        <ul class="ingredients-list">
          <li *ngFor="let ingredient of recipeDetails.ingredients.split('\n')">
            {{ingredient}}
          </li>
        </ul>
      </div>
      
      <div class="post-excerpt">
        <h3>Préparation :</h3>
        <ol class="steps-list">
          <li *ngFor="let step of recipeDetails.etapes.split('\n')">
            {{step}}
          </li>
        </ol>
      </div>
      
      <div class="recipe-footer">
        <span class="date"><i class="bi bi-calendar"></i> {{recipeDetails.data | date:'dd/MM/yyyy'}}</span>
      </div>
    </div>
  </article>
</div>
